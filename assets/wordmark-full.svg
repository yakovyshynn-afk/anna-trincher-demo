  <title id="wordmarkFullTitle">Анна Трінчер — офіційний wordmark</title>
  <desc id="wordmarkFullDesc">Кириличний геометричний логотип «АННА» і «ТРІНЧЕР» у два рядки: фірмові зрізані кути, горизонтальний світловий розрив у вертикальних штрихах і компактна діагональ у літерах «А» та «Ч». Колір paper-50 на прозорому фоні, для розміщення на темному космічному hero.</desc>
